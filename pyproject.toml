[project]
name = "from-0-to-agi"
version = "0.1.0"
description = "From 0 to AGI: from y = ax + b to state-of-the-art open models"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
    "torch>=2.5",
    "tokenizers>=0.21",
    "safetensors>=0.4",
]

[project.optional-dependencies]
video = [
    "edge-tts>=7.2.8",
    "manim>=0.19.0",
    "sherpa-onnx>=1.13.8",
    "sherpa-onnx-core>=1.13.8",
]

# Download of the pretraining data in Step 2 (zero/data/download.py): datasets reads the data as a stream,
# boto3 gets the file contents of Stack-Edu, and zstandard decompresses the .jsonl.zst files of DCLM
data = [
    "datasets>=3.0",
    "boto3>=1.34",
    "zstandard>=0.22",
]

# Course website (site/build.py): MkDocs Material with an English / Chinese language button
site = [
    "mkdocs>=1.6,<2",  # MkDocs 2.0 removes the plugin system that the i18n plugin needs
    "mkdocs-material>=9.7",
    "mkdocs-static-i18n>=1.3",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.16.9",
    "sentencepiece>=0.2.0",
    "transformers>=4.57.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "E741", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
