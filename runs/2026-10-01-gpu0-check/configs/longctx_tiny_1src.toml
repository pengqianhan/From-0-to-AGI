# For the multi-GPU 32K memory test: the same as longctx_tiny.toml, but the three sources are merged into one.
# In the tiny corpus, the code source gives only 2 segments of 32K, which is not enough for 3 ranks.
# With one merged source, there are about 28 segments.
base = "longctx_tiny.toml"

[[data.sources]]
name = "tiny"
path = "out/gpu0-check/tiny/data/*_train_*.bin"
weight = 1.0
