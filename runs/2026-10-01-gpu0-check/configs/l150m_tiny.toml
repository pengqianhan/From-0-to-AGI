# For the GPU0 check: the model shape and the optimizer of the ladder configuration l150m. The data is
# the tiny corpus that comes with the repository (assets/tiny_corpus,
# with a tokenizer that has a vocabulary of 2048; the model vocabulary is still 65,536, so the logits cost is the same
# as in the real ladder). Use it only to check the code paths and to measure throughput. The loss values have no meaning.
base = "../../../configs/ladder/l150m.toml"

[train]
out_dir = "out/gpu0-check/l150m"
micro_batch_size = 8     # 3090 24 GB: the FP32 logits peak of the ladder default 16 × 2048 does not fit.
                         # Use 8 × accumulation 2 (the tokens per step are the same as the share of one GPU).
grad_accum_steps = 2
gpu_peak_tflops = 71.0   # RTX 3090 dense BF16 peak (FP32 accumulation); the lookup table of zero does not include the 3090

[data]
tokenizer = "out/gpu0-check/tiny/tokenizer.json"
val = "out/gpu0-check/tiny/data/*_val_*.bin"

[[data.sources]]
name = "shakespeare"
path = "out/gpu0-check/tiny/data/shakespeare_train_*.bin"
weight = 0.45

[[data.sources]]
name = "chinese_poetry"
path = "out/gpu0-check/tiny/data/chinese_poetry_train_*.bin"
weight = 0.45

[[data.sources]]
name = "code"
path = "out/gpu0-check/tiny/data/code_train_*.bin"
weight = 0.1

[data.prepare]
raw_files = ["assets/tiny_corpus/*.txt"]
out_dir = "out/gpu0-check/tiny/data"
vocab_size = 2048
val_fraction = 0.05
doc_chars = 2000
