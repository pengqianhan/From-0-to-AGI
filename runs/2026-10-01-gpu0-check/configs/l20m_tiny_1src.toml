# For the multi-GPU parity check (dist2_check.py): the same as l20m_tiny.toml, but the three sources are
# merged into one PackedDataLoader.
# With several sources, the source sampler of MixtureLoader is seeded with (seed, rank), and each GPU samples
# its own sources. Thus the samples per step on 2 GPUs and on 1 GPU are different.
# With one source, global sample g goes to rank g % world_size. Then "B sequences on each of 2 GPUs" and
# "2B sequences on 1 GPU" are the same data, and a per-step parity check of the loss is possible.
base = "l20m_tiny.toml"

[[data.sources]]
name = "tiny"
path = "out/gpu0-check/tiny/data/*_train_*.bin"
weight = 1.0
