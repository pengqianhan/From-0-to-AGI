# Build the course website and publish it on GitHub Pages.
# One-time setup: in the repository settings, set Pages > Source to "GitHub Actions".
name: site

on:
  push:
    branches: [main]
    paths:
      - "README*.md"
      - "chapters/*/README*.md"
      - "docs/**"
      - "site/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "mkdocs>=1.6,<2" "mkdocs-material>=9.7" "mkdocs-static-i18n>=1.3" pyyaml
      - run: python site/build.py --build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
