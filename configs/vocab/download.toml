# Measurement corpus for Chapter 13, Section 10 ("how large is the vocabulary?"): a small sample from each
# main-line pretraining source. We use it only to measure the tokenizer compression on this machine.
# We do not train on it, and it is not in the repository. The mix is the same as the main line (configs/main/data.toml):
# English 0.55 = FineWeb-Edu 0.35 + DCLM 0.10 + FineMath 0.10, Chinese 0.30 = FineWeb-2 0.20 + Ultra-FineWeb 0.10,
# code 0.15. Code uses UltraData-Code-L2 instead of Stack-Edu. Stack-Edu has only the file ids;
# to get the text, you need AWS credentials for Software Heritage.
#
#   uv run python -m zero.data.download --config configs/vocab/download.toml --out /mnt/DataSets/phan635/From-0-to-AGI/raw_vocab
#   uv run python chapters/13-data/code/09_build_vocab_corpus.py --raw /mnt/DataSets/phan635/From-0-to-AGI/raw_vocab \
#       --out /mnt/DataSets/phan635/From-0-to-AGI/vocab_corpus
#
# Download size: 08_vocab_size.py trains the tokenizers on 30MB (English 16.5 / Chinese 9 / code 4.5).
# The validation set is English 1.75 / Chinese 0.8 / code 1.6MB.
# Each language has a margin of about 40%: English 24MB, Chinese 13MB, code 9MB, split across the sources by the mix.
# target_bytes counts the UTF-8 bytes of the text.
# Each revision is the commit on the download day (2026-10-01), so the download is reproducible.
# Streaming starts from the first file of each dataset, so the samples come mostly from the first dumps / shards.
# (For FineWeb-Edu, the randomly sampled sample-10BT subset makes this problem smaller.)
# runs/2026-10-01-vocab-corpus/README.md records the actual download results.

[[sources]]
name = "fineweb-edu"
registry = "fineweb-edu"
  [sources.download]
  repo = "HuggingFaceFW/fineweb-edu"
  config = "sample-10BT"
  revision = "87f09149ef4734204d70ed1d046ddc9ca3f2b8f9"
  keep_fields = ["url", "dump", "score", "int_score", "token_count", "language_score"]
  target_bytes = 15_300_000

[[sources]]
name = "dclm-baseline"
registry = "dclm-baseline"
  [sources.download]
  repo = "mlfoundations/dclm-baseline-1.0"
  revision = "a3b142c183aebe5af344955ae20836eb34dcf69b"
  keep_fields = ["url"]
  target_bytes = 4_350_000

