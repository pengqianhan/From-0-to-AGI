# 第 13 章第 10 节"词表选多大"的测量语料：从主线预训练来源里各抽一小份样本（只用于本地测量分词器压缩率，
# 不用于训练，也不进仓库）。配比和主线一致（configs/main/data.toml）：英文 0.55 = FineWeb-Edu 0.35 + DCLM 0.10
# + FineMath 0.10，中文 0.30 = FineWeb-2 0.20 + Ultra-FineWeb 0.10，代码 0.15。代码用 UltraData-Code-L2 代替
# Stack-Edu（后者只有文件 id，正文要用 AWS 凭证从 Software Heritage 取）。
#
#   uv run python -m zero.data.download --config configs/vocab/download.toml --out /mnt/DataSets/phan635/From-0-to-AGI/raw_vocab
#   uv run python chapters/13-data/code/09_build_vocab_corpus.py --raw /mnt/DataSets/phan635/From-0-to-AGI/raw_vocab \
#       --out /mnt/DataSets/phan635/From-0-to-AGI/vocab_corpus
#
# 下载量：08_vocab_size.py 训练分词器用 30MB（英 16.5 / 中 9 / 代码 4.5），验证集英 1.75 / 中 0.8 / 代码 1.6MB；
# 按语言留约 40% 余量：英 24MB、中 13MB、代码 9MB，各来源按配比分。target_bytes 按 UTF-8 正文字节计。
# revision 固定到 2026-10-01 下载当天的 commit，保证可复现。流式读取从各数据集的第一个文件开始，
# 样本偏向前几个 dump / 分片（FineWeb-Edu 用随机抽样的 sample-10BT 子集减轻这一点）。
# 实际下载结果记在 runs/2026-10-01-vocab-corpus/README.md。

[[sources]]
name = "fineweb-edu"
registry = "fineweb-edu"
  [sources.download]
  repo = "HuggingFaceFW/fineweb-edu"
  config = "sample-10BT"
  revision = "87f09149ef4734204d70ed1d046ddc9ca3f2b8f9"
  keep_fields = ["url", "dump", "score", "int_score", "token_count", "language_score"]
  target_bytes = 15_300_000

