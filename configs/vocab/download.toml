  target_bytes = 4_300_000

# Code 9MB: Python 30%, JavaScript / Java / C++ 15% each, Go / Rust / Shell / C# / PHP 5% each.
# (Of the 11 languages in UltraData-Code-L2, we removed R and Ruby. L3 is synthetic programming exercises,
# so the tokenizer measurement uses L2, which is natural code.)
[[sources]]
name = "ultradata-code-py"
registry = "ultradata-code"
  [sources.download]
  repo = "openbmb/UltraData-Code"
  config = "UltraData-Code-L2"
  split = "py"
  revision = "85182d829f2ce7ea07cca72ebfc509deea1d9f5f"
  text_field = "content"
  id_field = "uuid"
  keep_fields = ["repo_name", "relative_path", "category", "algo_rel_score", "quality_score"]
