# Shared config for the 3×RTX 3090 ladder experiment (runs/ladder-3090/README.md).
# The architecture is the same as the main-line model (configs/main/pretrain.toml).
# Only dim and the number of layers are smaller (see e*.toml in this folder).
# runs/ladder-3090/sweep.py overrides the searched hyperparameters (learning rate, β, weight decay,
# warmup, RoPE θ, batch) and the number of steps with --set. The values here are only placeholders.
[model]
vocab_size = 65536
head_dim = 64
rope_theta = 10000.0
max_seq_len = 2048
norm_eps = 1e-6
qk_norm = true
tie_embeddings = true
init_std = 0.02

[train]
seed = 1337
max_steps = 1000
micro_batch_size = 8
grad_accum_steps = 1
device = "auto"
dtype = "auto"            # BF16 autocast on CUDA
compile = true
eval_every = 0            # sweep.py sets this to 1/8 of the stable phase
eval_batches = 1000000    # Each evaluation uses the full fixed validation set (1024 segments; any power-of-2 micro batch divides it)

[data]
tokenizer = "data/ladder3090/tokenizer.json"
seq_len = 2048
val = "data/ladder3090/ladder_val.bin"   # Fixed validation set from runs/ladder-3090/build_val.py: validation shards of each source, in the training mix

# The training mix is the same as configs/main/data.toml (Chapter 13). Code uses UltraData-Code-L2 instead of Stack-Edu.
[[data.sources]]
name = "fineweb-edu"
path = "data/ladder3090/fineweb-edu_train_*.bin"
weight = 0.35
[[data.sources]]
name = "dclm-baseline"
path = "data/ladder3090/dclm-baseline_train_*.bin"
weight = 0.10
[[data.sources]]
name = "fineweb-2-zh"
path = "data/ladder3090/fineweb-2-zh_train_*.bin"
weight = 0.20
[[data.sources]]
name = "ultra-fineweb-zh"
path = "data/ladder3090/ultra-fineweb-zh_train_*.bin"
weight = 0.10
[[data.sources]]
name = "ultradata-code"
path = "data/ladder3090/ultradata-code_train_*.bin"
weight = 0.15
[[data.sources]]
name = "finemath"
path = "data/ladder3090/finemath_train_*.bin"
weight = 0.10

[optim]
lr = 1e-3
weight_decay = 0.1
beta1 = 0.9
beta2 = 0.95
grad_clip = 1.0

[schedule]
kind = "wsd"              # After the stable phase, linear decay to 0. sweep.py sets decay_frac so that the decay starts at checkpoint k/8.
warmup_steps = 10
decay_frac = 0.2
min_lr_ratio = 0.0

[checkpoint]
every = 1000
keep_last = 0             # Keep all checkpoints: the decay branches start at each 1/8 point of the stable phase

[logging]
every = 10
