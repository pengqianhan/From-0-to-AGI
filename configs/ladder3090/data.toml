# Data pipeline for the ladder experiment (runs/ladder-3090). The cleaning, quality, dedup, and
# tokenizer settings are the same as the main-line recipe (configs/main/data.toml).
# The input is about 16.8GB of samples from configs/ladder3090/download.toml
# (several files from different parts of each dataset).
#
#   bash runs/ladder-3090/download_all.sh
#   uv run python -m zero.data.pipeline --config configs/ladder3090/data.toml
#
# Differences from the main-line config (all recorded in runs/ladder-3090/README.md):
# - The code source is UltraData-Code-L2 (9 languages), not Stack-Edu. Stack-Edu needs AWS credentials to get the text.
# - Decontamination uses only the evaluation sets on this machine (the tool-calling dev set).
#   The files of MMLU, C-Eval, and the other evaluation sets are not downloaded yet.
# - The tokenizer training text is 2GB (main line: 20GB). This is sufficient only for the ladder.
#   The data and the shards are on the NAS, not in git.

[pipeline]
name = "ladder3090"
work_dir = "/mnt/DataSets/phan635/From-0-to-AGI/ladder/pipeline"
out_dir = "/mnt/DataSets/phan635/From-0-to-AGI/ladder/pretrain"
seed = 0
val_fraction = 0.001
val_max_docs = 5000
shard_tokens = 100_000_000
token_budget = 3.6e9
write_stages = false

[[sources]]
name = "fineweb-edu"
registry = "fineweb-edu"
inputs = ["/mnt/DataSets/phan635/From-0-to-AGI/ladder/raw/fineweb-edu-*/*.jsonl.gz"]
format = "jsonl"
weight = 0.35
lang = "en"
heuristics = "none"
score_field = "int_score"
score_min = 3

[[sources]]
name = "dclm-baseline"
registry = "dclm-baseline"
inputs = ["/mnt/DataSets/phan635/From-0-to-AGI/ladder/raw/dclm-baseline-*/*.jsonl.gz"]
format = "jsonl"
weight = 0.10
lang = "en"
heuristics = "none"

[[sources]]
name = "fineweb-2-zh"
registry = "fineweb-2-zh"
inputs = ["/mnt/DataSets/phan635/From-0-to-AGI/ladder/raw/fineweb-2-zh-*/*.jsonl.gz"]
format = "jsonl"
weight = 0.20
lang = "zh"
heuristics = "web"

[[sources]]
name = "ultra-fineweb-zh"
registry = "ultra-fineweb"
inputs = ["/mnt/DataSets/phan635/From-0-to-AGI/ladder/raw/ultra-fineweb-zh-*/*.jsonl.gz"]
format = "jsonl"
weight = 0.10
lang = "zh"
heuristics = "none"

[[sources]]
name = "ultradata-code"
registry = "ultradata-code"
inputs = ["/mnt/DataSets/phan635/From-0-to-AGI/ladder/raw/ultradata-code-*/*.jsonl.gz"]
format = "jsonl"
weight = 0.15
lang = "code"
heuristics = "code"

[[sources]]
name = "finemath"
registry = "finemath"
inputs = ["/mnt/DataSets/phan635/From-0-to-AGI/ladder/raw/finemath-*/*.jsonl.gz"]
format = "jsonl"
weight = 0.10
lang = "en"
heuristics = "none"

[quality]
min_words = 50

[dedup]
exact = true
near = true
threshold = 0.8
num_perm = 128
bands = 16
ngram = 5
cross_source = true
n_jobs = 32                       # Compute MinHash signatures in several processes (same result as one process)

[decontam]
n = 13
min_tokens = 8
[[decontam.eval_sets]]
name = "tool_dev"
path = "zero/eval/tasks/tool_dev.jsonl"

[tokenizer]
vocab_size = 65536
pretokenize = "qwen3.5"
sample_bytes = 2_000_000_000
min_frequency = 2
path = "/mnt/DataSets/phan635/From-0-to-AGI/ladder/pretrain/tokenizer.json"
