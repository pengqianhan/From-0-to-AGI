# Weak-base track, GRPO (track B). Without DPO: --set train.init_from=out/weak/distill/ckpt
base = "../main/grpo.toml"

[model]                  # Same shape as configs/main/pretrain.toml: an intermediate pretraining checkpoint has no long-context stage yet
rope_theta = 10000.0
max_seq_len = 4096

[train]
out_dir = "out/weak/grpo"
init_from = "out/weak/dpo/ckpt"

[data]
seq_len = 4096
