# Ladder experiment l150m: about 160.5M total parameters (with embedding). At about 20 tokens per parameter
# (the Chinchilla rule of thumb), it gets 3.21B tokens. Steps = 3.21B / 262,144 tokens per step ≈ 12245.
# The learning rate is a starting point. Chapter 12 sets it after a small sweep.
base = "base.toml"

[model]
dim = 768
n_layers = 16
n_heads = 12
n_kv_heads = 4
head_dim = 64
ffn_dim = 2304

[train]
max_steps = 12245
out_dir = "out/ladder/l150m"

[optim]
lr = 1.5e-3
