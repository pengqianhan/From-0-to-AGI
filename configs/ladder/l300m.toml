# 阶梯实验 l300m：总参数约 318.8M（含 embedding），按约 20 token/参数（Chinchilla 经验值）给 6.38B token。
# 步数 = 6.38B / 262,144 token/步 ≈ 24322。学习率是起点，第 12 章做小范围扫描后确定。
base = "base.toml"

[model]
dim = 1024
n_layers = 20
n_heads = 8
n_kv_heads = 4
head_dim = 128
ffn_dim = 3072

[train]
max_steps = 24322
out_dir = "out/ladder/l300m"

[optim]
lr = 1e-3
