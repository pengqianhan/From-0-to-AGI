# Ladder experiment l300m: about 318.8M total parameters (with embedding). At about 20 tokens per parameter
# (the Chinchilla rule of thumb), it gets 6.38B tokens. Steps = 6.38B / 262,144 tokens per step ≈ 24322.
# The learning rate is a starting point. Chapter 12 sets it after a small sweep.
base = "base.toml"

[model]
dim = 1024
n_layers = 20
n_heads = 8
n_kv_heads = 4
head_dim = 128
ffn_dim = 3072

[train]
max_steps = 24322
out_dir = "out/ladder/l300m"

[optim]
lr = 1e-3
