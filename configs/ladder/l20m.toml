# Ladder experiment l20m: about 23.1M total parameters (with embedding). At about 20 tokens per parameter
# (the Chinchilla rule of thumb), it gets 0.46B tokens. Steps = 0.46B / 262,144 tokens per step ≈ 1762.
# The learning rate is a starting point. Chapter 12 sets it after a small sweep.
base = "base.toml"

[model]
dim = 256
n_layers = 8
n_heads = 4
n_kv_heads = 2
head_dim = 64
ffn_dim = 768

[train]
max_steps = 1762
out_dir = "out/ladder/l20m"

[optim]
lr = 3e-3
