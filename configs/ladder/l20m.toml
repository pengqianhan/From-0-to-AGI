# 阶梯实验 l20m：总参数约 23.1M（含 embedding），按约 20 token/参数（Chinchilla 经验值）给 0.46B token。
# 步数 = 0.46B / 262,144 token/步 ≈ 1762。学习率是起点，第 12 章做小范围扫描后确定。
base = "base.toml"

[model]
dim = 256
n_layers = 8
n_heads = 4
n_kv_heads = 2
head_dim = 64
ffn_dim = 768

[train]
max_steps = 1762
out_dir = "out/ladder/l20m"

[optim]
lr = 3e-3
