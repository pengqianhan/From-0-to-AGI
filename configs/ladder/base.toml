# Shared config for the ladder experiment (scaling ladder, Chapter 12). Each size file inherits it
# with base = "base.toml" and changes only the model shape, the number of steps, and the learning rate.
# Purpose: the "extrapolated prediction" of gate 1. Fit a scaling law to the loss of some small models,
# then extrapolate the loss of the main-line model.
# All these configs run only in Step 2 (when we have GPUs). The values are starting points, not results.
# We assume one machine with 8 GPUs: tokens per step = micro_batch_size × grad_accum_steps × 8 × seq_len = 16 × 1 × 8 × 2048 = 262,144.
# The vocabulary is the same as the main line (65,536 for now; Chapter 13 sets it).
# Then the ladder results can extrapolate to the main line.

[model]
vocab_size = 65536
rope_theta = 10000.0
max_seq_len = 2048
norm_eps = 1e-6
qk_norm = true
tie_embeddings = true
init_std = 0.02

[train]
seed = 1337
micro_batch_size = 16
grad_accum_steps = 1
device = "auto"
dtype = "auto"           # BF16 autocast on CUDA
parallel = "ddp"
eval_every = 250
eval_batches = 20

[data]
tokenizer = "data/tokenizer/tokenizer.json"
seq_len = 2048
val = "data/pretrain/val_*.bin"

# The ablations of Chapter 13 will set the data mix. These values are placeholder starting points.
[[data.sources]]
name = "fineweb-edu"
path = "data/pretrain/fineweb-edu_*.bin"
weight = 0.45

[[data.sources]]
name = "fineweb-2-zh"
path = "data/pretrain/fineweb-2-zh_*.bin"
weight = 0.35

[[data.sources]]
name = "stack-edu"
path = "data/pretrain/stack-edu_*.bin"
weight = 0.12

[[data.sources]]
name = "finemath"
path = "data/pretrain/finemath_*.bin"
weight = 0.08

[optim]
weight_decay = 0.1
beta1 = 0.9
beta2 = 0.95
grad_clip = 1.0

[schedule]
kind = "wsd"             # WSD: decays of different lengths branch from the stable phase, so one training run gives points for several token budgets
warmup_steps = 200
decay_frac = 0.2
min_lr_ratio = 0.0

[checkpoint]
every = 1000
keep_last = 3

[logging]
every = 10
