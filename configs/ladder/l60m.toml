# Ladder experiment l60m: about 71.3M total parameters (with embedding). At about 20 tokens per parameter
# (the Chinchilla rule of thumb), it gets 1.43B tokens. Steps = 1.43B / 262,144 tokens per step ≈ 5440.
# The learning rate is a starting point. Chapter 12 sets it after a small sweep.
base = "base.toml"

[model]
dim = 512
n_layers = 12
n_heads = 8
n_kv_heads = 4
head_dim = 64
ffn_dim = 1536

[train]
max_steps = 5440
out_dir = "out/ladder/l60m"

[optim]
lr = 2e-3
