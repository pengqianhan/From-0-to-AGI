# 阶梯实验 l60m：总参数约 71.3M（含 embedding），按约 20 token/参数（Chinchilla 经验值）给 1.43B token。
# 步数 = 1.43B / 262,144 token/步 ≈ 5440。学习率是起点，第 12 章做小范围扫描后确定。
base = "base.toml"

[model]
dim = 512
n_layers = 12
n_heads = 8
n_kv_heads = 4
head_dim = 64
ffn_dim = 1536

[train]
max_steps = 5440
out_dir = "out/ladder/l60m"

[optim]
lr = 2e-3
