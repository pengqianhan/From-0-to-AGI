# Tiny distillation config (Chapter 17, "Tiny-configuration demo").
#   uv run python -m zero.post.distill --config configs/tiny/distill.toml
#
# The teacher is a stand-in. This environment cannot download any open weights (huggingface.co is not reachable).
# Thus the tiny SFT model is its own teacher (self-distillation / rejection-sampling fine-tuning).
# This config verifies only the path "teacher sampling → execution check → packing → sequence-level + logits distillation".
# Step 2 uses a real teacher: see configs/main/distill.toml.

[model]                  # Student: same shape as the SFT checkpoint
vocab_size = 2048
dim = 128
n_layers = 4
n_heads = 4
n_kv_heads = 2
head_dim = 32
ffn_dim = 384
rope_theta = 10000.0
max_seq_len = 1024
tie_embeddings = false
rope_scaling = { type = "yarn", factor = 8.0, original_max_position_embeddings = 128, beta_fast = 32.0, beta_slow = 1.0 }

[train]
seed = 1337
max_steps = 30
micro_batch_size = 4
device = "cpu"
dtype = "fp32"
cpu_threads = 1
out_dir = "out/tiny/distill"
init_from = "out/tiny/sft/ckpt"   # The student starts from SFT
eval_every = 0

[data]
format = "sft"           # Pack the teacher trajectories as in SFT (the loss uses only the assistant tokens)
tokenizer = "out/tiny/tokenizer.json"
seq_len = 1024

[teacher]
backend = "local"
path = "out/tiny/sft/ckpt"        # Stand-in teacher: the tiny SFT model itself
name = "zero-tiny-sft (self-distillation stand-in)"
version = "local"
license = "same as this repository"
temperature = 0.7
top_p = 0.95
max_new_tokens = 96

[distill]
out_jsonl = "out/tiny/distill/teacher.jsonl"
shard_dir = "out/tiny/distill/data"
n_tasks = 48
samples_per_task = 4
keep_per_task = 1
env_seed = 3
mix_sft_jsonl = "out/tiny/sft/train.jsonl"   # When there is little teacher data, mix in the original SFT data to prevent forgetting
mix_sft_max = 200
logits_kd = true
kd_alpha = 0.5
kd_temperature = 1.0
kd_topk = 0
on_policy_steps = 0      # On-policy distillation: to be verified (GOAL.md 2.1); off by default

[optim]
lr = 3e-4
weight_decay = 0.0
grad_clip = 1.0

[schedule]
kind = "cosine"
warmup_steps = 3
min_lr_ratio = 0.1

[checkpoint]
every = 0
keep_last = 1

[logging]
every = 5
