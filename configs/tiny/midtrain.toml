# tiny 中期训练配置（第 15 章"极小配置演示"）：在 tiny 预训练权重上同时演示三件事
#   1) 换数据混合（加大中文比例）；
#   2) 纯衰减段的学习率（WSD 的 decay_frac = 1.0：从峰值一路线性降下去）；
#   3) 长上下文扩展：seq_len 128 → 256，并用 YaRN（factor = 2）缩放 RoPE。
# 先跑 configs/tiny/pretrain.toml，再：
#   uv run python -m zero.train.midtrain --config configs/tiny/midtrain.toml
base = "pretrain.toml"   # 其余字段继承预训练配置

[model]
# YaRN：原训练长度 128，扩展 2 倍到 256。模型形状不变，只有 RoPE 的 cos/sin 重新计算
rope_scaling = { type = "yarn", factor = 2.0, original_max_position_embeddings = 128, beta_fast = 32.0, beta_slow = 1.0 }

[train]
max_steps = 60
micro_batch_size = 8     # 序列翻倍，batch 减半，每步 token 数不变
out_dir = "out/tiny/midtrain"
init_from = "out/tiny/pretrain/ckpt"   # 预训练 checkpoint（取其中最新的一个）
eval_every = 30

[data]
seq_len = 256

[[data.sources]]
name = "shakespeare"
path = "out/tiny/data/shakespeare_train_*.bin"
weight = 0.3

[[data.sources]]
name = "chinese_poetry"
path = "out/tiny/data/chinese_poetry_train_*.bin"
weight = 0.6

[[data.sources]]
name = "code"
path = "out/tiny/data/code_train_*.bin"
weight = 0.1

[optim]
lr = 1e-3

[schedule]
kind = "wsd"
warmup_steps = 0
decay_frac = 1.0         # 整段都是衰减
min_lr_ratio = 0.0

[checkpoint]
every = 30
