# Tiny mid-training config (Chapter 15, "Tiny-configuration demo"). On the tiny pretrained weights, it shows three things together:
#   1) A different data mix (a larger share of Chinese).
#   2) The learning rate of a decay-only stage (WSD with decay_frac = 1.0: a linear decrease from the peak to the end).
#   3) Long-context extension: seq_len 128 → 256, with YaRN (factor = 2) to scale RoPE.
# Run configs/tiny/pretrain.toml first, then:
#   uv run python -m zero.train.midtrain --config configs/tiny/midtrain.toml
base = "pretrain.toml"   # The other fields come from the pretraining config

[model]
# YaRN: the original training length is 128; 2 times longer is 256. The model shape does not change; only the RoPE cos/sin are computed again
rope_scaling = { type = "yarn", factor = 2.0, original_max_position_embeddings = 128, beta_fast = 32.0, beta_slow = 1.0 }

[train]
max_steps = 60
micro_batch_size = 8     # The sequences double and the batch halves, so the tokens per step do not change
out_dir = "out/tiny/midtrain"
init_from = "out/tiny/pretrain/ckpt"   # Pretraining checkpoint (the latest one in this folder)
eval_every = 30

[data]
seq_len = 256

[[data.sources]]
name = "shakespeare"
path = "out/tiny/data/shakespeare_train_*.bin"
weight = 0.3

[[data.sources]]
name = "chinese_poetry"
path = "out/tiny/data/chinese_poetry_train_*.bin"
weight = 0.6

[[data.sources]]
name = "code"
path = "out/tiny/data/code_train_*.bin"
weight = 0.1

[optim]
lr = 1e-3

[schedule]
kind = "wsd"
warmup_steps = 0
decay_frac = 1.0         # The full stage is decay
min_lr_ratio = 0.0

[checkpoint]
every = 30
