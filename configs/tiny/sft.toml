# Tiny SFT config (Chapter 16, "Tiny-configuration demo"): SFT on the tiny mid-training weights,
# with tool-calling chats that tool_env generates.
# Run configs/tiny/pretrain.toml and midtrain.toml first, then:
#   uv run python -m zero.post.sft --config configs/tiny/sft.toml
# Notes:
# - This tokenizer (out/tiny/tokenizer.json) saw no chat / JSON format in training. One chat with tool descriptions
#   is about 700 tokens, so seq_len is 1024. `python -m zero.smoke` trains a tokenizer that saw text in the
#   tool-calling format. Then the same chat is about 330 tokens, and seq_len changes to 512.
#   (The main-line tokenizer corpus is very large, so the main line does not have this problem.)
# - Tiny model + toy data: the results show only that "the code runs and the loss decreases".

[model]                  # Must have the same shape as the mid-training checkpoint (only the RoPE fields and max_seq_len can be different)
vocab_size = 2048
dim = 128
n_layers = 4
n_heads = 4
n_kv_heads = 2
head_dim = 32
ffn_dim = 384
rope_theta = 10000.0
max_seq_len = 1024
tie_embeddings = false
# The original training length is 128; extend to 1024 (factor = 8)
rope_scaling = { type = "yarn", factor = 8.0, original_max_position_embeddings = 128, beta_fast = 32.0, beta_slow = 1.0 }

[train]
seed = 1337
max_steps = 300
micro_batch_size = 4
grad_accum_steps = 1
device = "cpu"
dtype = "fp32"
cpu_threads = 1
out_dir = "out/tiny/sft"
init_from = "out/tiny/midtrain/ckpt"
eval_every = 100
eval_batches = 4

[data]
format = "sft"           # Read the packed chat windows + loss mask (zero.post.sft fills in sources / val automatically)
tokenizer = "out/tiny/tokenizer.json"
seq_len = 1024

[sft]
train_jsonl = "out/tiny/sft/train.jsonl"
val_jsonl = "out/tiny/sft/val.jsonl"
shard_dir = "out/tiny/sft/data"
generate_train = 1500    # If the file does not exist, tool_env generates it (reference solution trajectories)
generate_val = 64
env_seed = 0

[optim]
lr = 2e-3                # Tiny model: at 1e-3 × 120 steps, most call JSON was broken. After 2e-3 × 240–300 steps, the format and function names were mostly correct, but the arguments were still wrong
weight_decay = 0.0       # SFT has few steps, so no weight decay
grad_clip = 1.0

[schedule]
kind = "cosine"
warmup_steps = 10
min_lr_ratio = 0.1

[checkpoint]
every = 100
keep_last = 1

[logging]
every = 10
