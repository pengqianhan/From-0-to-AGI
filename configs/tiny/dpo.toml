# Tiny DPO config (Chapter 18, "Tiny-configuration demo"): DPO on the weights after tiny distillation.
#   uv run python -m zero.post.dpo --config configs/tiny/dpo.toml
# If there is no preference data, make it on the spot with the tool environment + the current policy
# (see make_env_preferences in zero/post/dpo.py).

[model]                  # Same shape as the SFT checkpoint
vocab_size = 2048
dim = 128
n_layers = 4
n_heads = 4
n_kv_heads = 2
head_dim = 32
ffn_dim = 384
rope_theta = 10000.0
max_seq_len = 1024
tie_embeddings = false
rope_scaling = { type = "yarn", factor = 8.0, original_max_position_embeddings = 128, beta_fast = 32.0, beta_slow = 1.0 }

[train]
seed = 1337
max_steps = 40
micro_batch_size = 4     # 4 pairs per step (chosen + rejected: 8 sequences in total)
grad_accum_steps = 1
device = "cpu"
dtype = "fp32"
cpu_threads = 1
out_dir = "out/tiny/dpo"
init_from = "out/tiny/distill/ckpt"   # Pipeline order: SFT → distillation → DPO

[data]
format = "none"          # [dpo] controls the data
tokenizer = "out/tiny/tokenizer.json"
seq_len = 1024           # Drop the preference pairs that are longer than this

[dpo]
train_jsonl = "out/tiny/dpo/prefs.jsonl"
beta = 0.1
ref_mode = "precompute"  # Compute the log-probabilities of the reference model before training; "online" computes them at each step
generate_pairs = 64      # If the file does not exist, make 64 pairs
samples_per_prompt = 4
gen_temperature = 1.0
max_new_tokens = 64
env_seed = 1

[optim]
lr = 5e-5                # Measured: with 5e-4, the margin went up to 4.8 in 24 steps, and then the GRPO format accuracy fell from 0.16 to 0. 5e-5 is more stable
weight_decay = 0.0
grad_clip = 1.0

[schedule]
kind = "cosine"
warmup_steps = 4
min_lr_ratio = 0.1

[checkpoint]
every = 0                # Save only at the end
keep_last = 1

[logging]
every = 5
