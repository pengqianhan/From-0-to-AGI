# Tiny evaluation config (Chapters 11 and 20, "Tiny-configuration demo"): compare the models of the post-training stages
# on the toy evaluation sets + the tool-calling dev set.
#   uv run python -m zero.eval.harness --config configs/tiny/eval.toml
# A checkpoint path that does not exist causes an error. First run all stages of configs/tiny
# (or run uv run python -m zero.smoke). The scores of a tiny model are near random.
# They show only that the evaluation code runs.

[eval]
mc_tasks = ["toy_mc.jsonl"]          # A relative path looks in the current folder first, then in zero/eval/tasks/
gen_tasks = ["toy_gen.jsonl"]
tool_tasks = "tool_dev.jsonl"
fewshot = 3
max_items = 30                       # At most 30 questions per task (inference with the tiny model also takes time)
max_new_tokens = 96
max_turns = 3
out_dir = "out/tiny/eval"
baseline = "sft"                     # Each other model gets a paired bootstrap against SFT
n_boot = 2000
seed = 0
cpu_threads = 1

[[eval.models]]
name = "sft"
path = "out/tiny/sft/ckpt"

[[eval.models]]
name = "grpo"
path = "out/tiny/grpo/ckpt"
