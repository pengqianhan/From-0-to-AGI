# Tiny GRPO config (Chapter 19, "Tiny-configuration demo"): GRPO with the verifiable rewards of tool_env,
# on the weights after tiny DPO.
#   uv run python -m zero.post.grpo --config configs/tiny/grpo.toml
# Most rewards of a tiny model are -1 (wrong format) or very low. The curves show only that "the code runs".
# They do not show how well the method works.

[model]                  # Same shape as the SFT checkpoint
vocab_size = 2048
dim = 128
n_layers = 4
n_heads = 4
n_kv_heads = 2
head_dim = 32
ffn_dim = 384
rope_theta = 10000.0
max_seq_len = 1024
tie_embeddings = false
rope_scaling = { type = "yarn", factor = 8.0, original_max_position_embeddings = 128, beta_fast = 32.0, beta_slow = 1.0 }

[train]
seed = 1337
max_steps = 20
device = "cpu"
dtype = "fp32"
cpu_threads = 1
out_dir = "out/tiny/grpo"
init_from = "out/tiny/dpo/ckpt"

[data]
format = "none"
tokenizer = "out/tiny/tokenizer.json"
seq_len = 1024

[grpo]
group_size = 8           # G
prompts_per_step = 4     # 4 tasks × 8 responses = 32 per step
max_new_tokens = 64
temperature = 1.0
clip_eps = 0.2
kl_coef = 0.02           # A small KL constraint, to show how the reference model is used
ppo_epochs = 1
loss_agg = "token_mean"
scale_rewards = true
n_train_tasks = 500
env_seed = 2
forward_batch = 16

[optim]
lr = 5e-5
weight_decay = 0.0
grad_clip = 1.0

[schedule]
kind = "constant"
warmup_steps = 2

[checkpoint]
every = 0
keep_last = 1

[logging]
every = 1
