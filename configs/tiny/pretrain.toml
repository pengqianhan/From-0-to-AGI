# Tiny pretraining config: a smoke test that runs in tens of seconds on a CPU (Chapter 14, "Tiny-configuration demo").
# About 1.3M parameters. It trains a tokenizer on assets/tiny_corpus/ and makes the shards on the spot,
# then trains for a few hundred steps.
#   uv run python -m zero.train.pretrain --config configs/tiny/pretrain.toml
# Note: at this scale, the results show only that "the code runs and the loss decreases".
# They do not support any conclusion about the main-line model.

[model]
vocab_size = 2048        # Must be equal to the vocabulary size of the tokenizer ([data.prepare] vocab_size)
dim = 128                # Hidden dimension
n_layers = 4
n_heads = 4
n_kv_heads = 2           # GQA: each 2 query heads share one set of K/V
head_dim = 32
ffn_dim = 384            # SwiGLU hidden dimension (= 3 × dim)
rope_theta = 10000.0
max_seq_len = 256        # Reserved for mid-training, which doubles seq_len
norm_eps = 1e-6
qk_norm = true
tie_embeddings = false   # The main-line model ties the embeddings. But at this tiny scale, we measured that untied embeddings
                         # leave the "guess only frequent words" plateau faster (val 5.71 vs 5.91 at 200 steps). The smoke demo is clearer
init_std = 0.02

[train]
seed = 1337
max_steps = 200
micro_batch_size = 16
grad_accum_steps = 1
device = "cpu"
dtype = "fp32"
cpu_threads = 1          # One thread: when other processes use the CPU, many threads are much slower
out_dir = "out/tiny/pretrain"
eval_every = 100
eval_batches = 4

[data]
tokenizer = "out/tiny/tokenizer.json"
seq_len = 128
val = "out/tiny/data/*_val_*.bin"

# Mix the three sources by weight (see zero/data/mixture.py)
[[data.sources]]
name = "shakespeare"
path = "out/tiny/data/shakespeare_train_*.bin"
weight = 0.45

[[data.sources]]
name = "chinese_poetry"
path = "out/tiny/data/chinese_poetry_train_*.bin"
weight = 0.45

[[data.sources]]
name = "code"
path = "out/tiny/data/code_train_*.bin"
weight = 0.1

# If the shards do not exist, make them from the raw text on the spot (only in the tiny configs)
[data.prepare]
raw_files = ["assets/tiny_corpus/*.txt"]
out_dir = "out/tiny/data"
vocab_size = 2048
val_fraction = 0.05
doc_chars = 2000

[optim]
lr = 3e-3                # A tiny model can use a very large learning rate
weight_decay = 0.1
beta1 = 0.9
beta2 = 0.95
grad_clip = 1.0

[schedule]
kind = "wsd"             # warmup → stable → linear decay in the last 20%
warmup_steps = 30
decay_frac = 0.2
min_lr_ratio = 0.1

[checkpoint]
every = 100
keep_last = 2
resume = true

[logging]
every = 25
