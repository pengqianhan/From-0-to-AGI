# Tiny data pipeline (Chapter 13, "Tiny-configuration demo"): run assets/tiny_corpus through the full data pipeline.
#   uv run python -m zero.data.pipeline --config configs/tiny/data.toml
# Output: out/tiny/data_pipeline/ (JSONL of each stage, manifest.json, pretrain_sources.toml)
#         out/tiny/data_pipeline/shards/ (tokenizer.json + <source>_{train,val}_*.bin)
# To train the tiny model on these shards, paste [data] from pretrain_sources.toml into a copy of configs/tiny/pretrain.toml.
# Note: this is a 2.5MB toy corpus. The numbers in the funnel only show that "each stage really works".
# They do not show the ratios of real web data.

[pipeline]
name = "tiny"
work_dir = "out/tiny/data_pipeline"
seed = 0
val_fraction = 0.05
shard_tokens = 1_000_000

[[sources]]
name = "shakespeare"
registry = "tiny-shakespeare"
inputs = ["assets/tiny_corpus/shakespeare.txt"]
format = "text"
doc_chars = 2000
weight = 0.45
lang = "en"
heuristics = "web"        # The web rules remove some good text from the plays (many short lines of dialog). Chapter 13 discusses this

[[sources]]
name = "chinese_poetry"
registry = "tiny-chinese-poetry"
inputs = ["assets/tiny_corpus/chinese_poetry.txt"]
format = "text"
doc_chars = 2000
weight = 0.45
lang = "zh"
heuristics = "web"

[[sources]]
name = "code"
registry = "tiny-code"
inputs = ["assets/tiny_corpus/code.txt"]
format = "text"
doc_chars = 2000
weight = 0.10
lang = "code"
heuristics = "code"       # The web rules remove 96% of the code (no stop words, no period at line end). Code uses the code rules

[quality]                 # Overrides the default thresholds of zero/data/quality.py (the defaults come from Gopher / FineWeb)
min_words = 50

[dedup]
exact = true
near = true
threshold = 0.8           # A pair is a near duplicate only if the MinHash estimate of Jaccard is ≥ 0.8
num_perm = 128
bands = 16                # 16 bands × 8 rows: S-curve threshold (1/16)^(1/8) ≈ 0.71
ngram = 5
cross_source = true

[decontam]
n = 13
min_tokens = 8
# For the smoke test: the tool-calling dev set of the main line (the check includes function names, schemas, and questions)
[[decontam.eval_sets]]
name = "tool_dev"
path = "zero/eval/tasks/tool_dev.jsonl"

[tokenizer]
vocab_size = 2048
pretokenize = "qwen2"     # "qwen2" (= Qwen3, zero default) | "qwen3.5". For the main-line choice, see configs/main/data.toml
sample_bytes = 0          # 0 = train the tokenizer on all training text
