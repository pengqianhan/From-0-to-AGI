# Internal evaluation of the main-line model (Chapters 11 and 20): compare the post-training stages
# on the tool_env dev set and the toy sets, with a paired bootstrap.
#   uv run python -m zero.eval.harness --config configs/main/eval.toml
# The official benchmarks (BFCL, MMLU-Redux, C-Eval, GSM8K, ...) are not here. Run them with the official frameworks,
# as eval/PREREGISTRATION.md specifies. For BFCL, see zero/eval/bfcl.py (not verified yet).

[eval]
mc_tasks = ["toy_mc.jsonl"]
gen_tasks = ["toy_gen.jsonl"]
tool_tasks = "tool_dev.jsonl"
fc_tasks = ["data/rl/fc_dev.jsonl"]   # Real function-calling dev set (first turn); built with zero.post.envs.fc_tasks
fewshot = 3
max_items = 0
max_new_tokens = 512
max_turns = 4
out_dir = "out/main/eval"
baseline = "sft"
n_boot = 10000
seed = 0

[[eval.models]]
name = "sft"
path = "out/main/sft/ckpt"

[[eval.models]]
name = "distill"
path = "out/main/distill/ckpt"

[[eval.models]]
name = "dpo"
path = "out/main/dpo/ckpt"

[[eval.models]]
name = "grpo"
path = "out/main/grpo/ckpt"

[[eval.models]]
name = "opd"
path = "out/main/opd/ckpt"
