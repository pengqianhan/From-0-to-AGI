# Mid-training / annealing of the main-line model (Chapter 15): continue from the WSD stable phase of pretraining,
# change to a high-quality data mix, and decay the learning rate to 0.
# Chapters 13 and 15 will set the data sources and the mix. zero/post will make the shards of the instruction data
# and of the tool-calling format data (not implemented yet).
#   uv run torchrun --standalone --nproc_per_node=8 -m zero.train.midtrain --config configs/main/midtrain.toml
base = "pretrain.toml"

[train]
max_steps = 50000        # ≈ 26B tokens (524,288 per step), about 5% of pretraining; not final
out_dir = "out/main/midtrain"
init_from = "out/main/pretrain/ckpt"

[[data.sources]]
name = "fineweb-edu"
path = "data/pretrain/fineweb-edu_*.bin"
weight = 0.35

[[data.sources]]
name = "fineweb-2-zh"
path = "data/pretrain/fineweb-2-zh_*.bin"
weight = 0.25

[[data.sources]]
name = "stack-edu"
path = "data/pretrain/stack-edu_*.bin"
weight = 0.15

[[data.sources]]
name = "finemath"
path = "data/pretrain/finemath_*.bin"
weight = 0.15

[[data.sources]]
name = "instruct-toolcall"
path = "data/midtrain/instruct-toolcall_*.bin"
weight = 0.10

[schedule]
kind = "wsd"
warmup_steps = 0
decay_frac = 1.0         # Linear decay over the full stage: peak → 0
min_lr_ratio = 0.0
