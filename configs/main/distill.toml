# Distillation of the main-line model (Chapter 17). Default values for Step 2; tune them later.
# The teacher runs as an OpenAI-compatible server in vLLM (on a different group of GPUs, or on the same machine:
# generate the data first, then train):
#   vllm serve <teacher HF folder or name> --tensor-parallel-size 2 --enable-auto-tool-choice --tool-call-parser hermes
#   uv run python -m zero.post.distill --config configs/main/distill.toml --generate-only   # teacher data, one process
#   uv run torchrun --standalone --nproc_per_node=8 -m zero.post.distill --config configs/main/distill.toml
# (the training run reuses the teacher data: rank 0 mixes and packs it, then all GPUs train, as in SFT)
# Teacher candidates (license from the model metadata, 2026-10-10; the choice is the project lead's, see
# runs/POSTTRAIN_PLAN.md 6.4): Qwen3.5-35B-A3B / Qwen3.5-122B-A10B / Qwen3-235B-A22B-Instruct-2507 (Apache-2.0),
# gpt-oss-120b (Apache-2.0 + OpenAI usage policy), DeepSeek-V4.1-Flash (MIT), GLM-5.2 (MIT, zh/en).
# Our own tokenizer is different from the tokenizer of all open teachers → only sequence-level distillation is possible (logits_kd = false).
# Fill in and verify the name / version / license of the teacher before the run (GOAL.md 3.3).
# license_allows_distillation is false by default: without verification, the program does not run.
# Not verified on a GPU yet.

[model]                  # Same shape as the checkpoint of configs/main/longctx.toml (689.5M parameters)
vocab_size = 65536
dim = 1280
n_layers = 28
n_heads = 16
n_kv_heads = 8
head_dim = 128
ffn_dim = 3584
rope_theta = 1000000.0   # The larger base from the long-context stage
max_seq_len = 32768
tie_embeddings = true

[train]
seed = 1337
max_steps = 1500
micro_batch_size = 4
grad_accum_steps = 2
device = "auto"
dtype = "auto"
out_dir = "out/main/distill"
init_from = "out/main/sft/ckpt"
eval_every = 0

[data]
format = "sft"
tokenizer = "data/tokenizer/tokenizer.json"
seq_len = 8192

[teacher]
backend = "openai"
base_url = "http://localhost:8000/v1"
model = "teacher"                  # vllm serve --served-model-name teacher
name = "待定（第二步确定）"          # Example: a Qwen3 model with the Apache-2.0 license (must be verified)
version = "待定"
license = "待核实"
license_allows_distillation = false
temperature = 0.7
top_p = 0.95
max_new_tokens = 1024

[distill]
out_jsonl = "data/distill/teacher.jsonl"
shard_dir = "data/distill/packed"
n_tasks = 200000         # tool_env: the toy environment, executed and checked end to end (multi-turn with tool results)
task_files = []          # real function-calling tasks: keep teacher first turns that score exact (e.g. "no call" tasks, for the teacher's wording)
prompt_files = []        # prompts without answers, e.g. Chinese instructions → Chinese SFT data (the Chinese gap, plan 6.2)
prompt_license = ""      # license of the prompts in prompt_files (empty: the teacher license)
match_lang = true        # prompt_files: drop answers in another language than the prompt
concurrency = 64         # parallel requests to the vLLM server
samples_per_task = 4
keep_per_task = 1
env_seed = 17
mix_sft_jsonl = "data/sft/train.jsonl"
mix_sft_max = 200000
logits_kd = false
on_policy_steps = 0      # On-policy distillation: to be verified (GOAL.md 2.1)

[optim]
lr = 3e-5
weight_decay = 0.0
grad_clip = 1.0

[schedule]
kind = "cosine"
warmup_steps = 50
min_lr_ratio = 0.1

[checkpoint]
every = 500
keep_last = 2
