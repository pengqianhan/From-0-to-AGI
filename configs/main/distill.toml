# 主线模型蒸馏（第 17 章）。第二步默认值，待调。
# 教师用 vLLM 起 OpenAI 兼容服务（在另一组 GPU 或同机先生成数据、再训练）：
#   vllm serve <教师 HF 目录或名称> --tensor-parallel-size 2 --enable-auto-tool-choice --tool-call-parser hermes
#   uv run python -m zero.post.distill --config configs/main/distill.toml
# 我们自训的分词器与任何开源教师都不同 → 只能做序列级蒸馏（logits_kd = false）。
# 教师的名称 / 版本 / 许可证必须在运行前填好并核实（GOAL.md 3.3）；license_allows_distillation 默认 false，
# 没核实就拒绝运行。尚未在 GPU 上验证。

[model]                  # 与 configs/main/longctx.toml 的 checkpoint 形状一致（689.5M 参数）
vocab_size = 65536
dim = 1280
n_layers = 28
n_heads = 16
n_kv_heads = 8
head_dim = 128
ffn_dim = 3584
rope_theta = 1000000.0   # 长上下文阶段调大后的底数
max_seq_len = 32768
tie_embeddings = true

[train]
seed = 1337
max_steps = 1500
micro_batch_size = 4
grad_accum_steps = 2
device = "auto"
dtype = "auto"
out_dir = "out/main/distill"
init_from = "out/main/sft/ckpt"
eval_every = 0

[data]
format = "sft"
tokenizer = "data/tokenizer/tokenizer.json"
seq_len = 8192

[teacher]
backend = "openai"
base_url = "http://localhost:8000/v1"
model = "teacher"                  # vllm serve --served-model-name teacher
name = "待定（第二步确定）"          # 例：Qwen3 系列中许可证为 Apache-2.0 的模型，需核实
version = "待定"
license = "待核实"
license_allows_distillation = false
temperature = 0.7
top_p = 0.95
max_new_tokens = 1024

[distill]
out_jsonl = "data/distill/teacher.jsonl"
shard_dir = "data/distill/packed"
n_tasks = 200000         # tool_env 只是玩具环境；第二步还要接入真实的工具调用任务集（第 17、19 章）
samples_per_task = 4
keep_per_task = 1
env_seed = 17
mix_sft_jsonl = "data/sft/train.jsonl"
mix_sft_max = 200000
logits_kd = false
on_policy_steps = 0      # 在线策略蒸馏：待核实（GOAL.md 2.1）

[optim]
lr = 3e-5
weight_decay = 0.0
grad_clip = 1.0

[schedule]
kind = "cosine"
warmup_steps = 50
min_lr_ratio = 0.1

[checkpoint]
every = 500
keep_last = 2
