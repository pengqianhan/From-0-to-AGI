# 主线模型预训练配置（第 12、14 章）。第二步才会真正运行；所有数值待闸门 1 的阶梯实验确认。
#
# 形状：参照 Qwen3-0.6B（28 层、16 个查询头、8 个 K/V 头、head_dim 128、QK-Norm、共享 embedding），
# 把宽度从 1024 加到 1280、FFN 从 3072 加到 3584，把参数预算更多放在"非 embedding"部分：
#   uv run python -m zero.tools.count_params configs/main/pretrain.toml
#   → 总参数 689.5M，其中 embedding 83.9M，非 embedding 605.6M（Qwen3-0.6B 同口径约 596M / 441M）。
# 约束：总参数（含 embedding）≤ 0.8B（GOAL.md 3.3）。
#
# 词表 65,536 是**暂定值**，第 13 章按实测压缩率决定：
#   - 小模型的 embedding 很贵：Qwen3 的 151,936 词表放在这个宽度上要 194M 参数，总量 800.1M，刚好超线；
#   - 65,536（2^16）对中英代码三语的压缩率与参数代价是个折中起点；换成 131,072 时总量 773.4M，仍 ≤ 0.8B。
#   改词表时务必重新跑 count_params 确认不超过 0.8B。
#
# 预训练 token 预算按 GOAL.md 3.3 的 0.5–1T 取下限 500B（闸门 1 定稿）：
#   每步 token = micro_batch_size 8 × grad_accum_steps 2 × 8 卡 × seq_len 4096 = 524,288
#   max_steps = 500e9 / 524,288 ≈ 953,674
#   uv run python -m zero.tools.estimate_cost --config configs/main/pretrain.toml --tokens 500B --gpu h100-sxm
# 显存：micro_batch_size / grad_accum_steps 的组合尚未在 GPU 上验证，阶段 6 实测后调整。

[model]
vocab_size = 65536
dim = 1280
n_layers = 28
n_heads = 16
n_kv_heads = 8
head_dim = 128
ffn_dim = 3584
rope_theta = 10000.0     # 预训练用 1 万；长上下文阶段再调大（见 longctx.toml）
max_seq_len = 4096
norm_eps = 1e-6
qk_norm = true
tie_embeddings = true
init_std = 0.02

[train]
seed = 1337
max_steps = 953674
micro_batch_size = 8
grad_accum_steps = 2
device = "auto"
dtype = "auto"           # CUDA 上 BF16 autocast
compile = true           # 尚未在 GPU 上验证
parallel = "ddp"         # 0.7B + AdamW 在 80GB 卡上放得下；显存不够时改 "fsdp"
out_dir = "out/main/pretrain"
eval_every = 1000
eval_batches = 50

[data]
tokenizer = "data/tokenizer/tokenizer.json"
seq_len = 4096
val = "data/pretrain/val_*.bin"

# 数据配比待第 13 章消融实验确定；许可证见 zero/data/sources.py
[[data.sources]]
name = "fineweb-edu"
path = "data/pretrain/fineweb-edu_*.bin"
weight = 0.40

[[data.sources]]
name = "dclm-baseline"
path = "data/pretrain/dclm-baseline_*.bin"
weight = 0.10

[[data.sources]]
name = "fineweb-2-zh"
path = "data/pretrain/fineweb-2-zh_*.bin"
weight = 0.30

[[data.sources]]
name = "stack-edu"
path = "data/pretrain/stack-edu_*.bin"
weight = 0.12

[[data.sources]]
name = "finemath"
path = "data/pretrain/finemath_*.bin"
weight = 0.08

[optim]
lr = 3e-4                # 起点，第 12 章用阶梯实验扫描后确定
weight_decay = 0.1
beta1 = 0.9
beta2 = 0.95
grad_clip = 1.0

[schedule]
kind = "wsd"             # 稳定段结束后由中期训练（midtrain.toml）完成衰减
warmup_steps = 2000
decay_frac = 0.0         # 预训练本身不衰减，衰减放到中期训练
min_lr_ratio = 0.0

[checkpoint]
every = 2000
keep_last = 3

[logging]
every = 10
