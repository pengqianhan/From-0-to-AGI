# Pretraining config of the main-line model (Chapters 12 and 14). It runs only in Step 2.
# The ladder experiment of gate 1 must confirm all values.
#
# Shape: based on Qwen3-0.6B (28 layers, 16 query heads, 8 K/V heads, head_dim 128, QK-Norm, tied embeddings).
# The width increases from 1024 to 1280 and the FFN from 3072 to 3584. Thus more of the parameter budget
# goes to the "non-embedding" part:
#   uv run python -m zero.tools.count_params configs/main/pretrain.toml
#   → 689.5M total parameters: embedding 83.9M, non-embedding 605.6M (Qwen3-0.6B, counted the same way: about 596M / 441M).
# Constraint: total parameters (with embedding) ≤ 0.8B (GOAL.md 3.3).
#
# The vocabulary of 65,536 is **provisional**. Chapter 13 decides it from the measured compression:
#   - The embedding is expensive for a small model. The Qwen3 vocabulary of 151,936 needs 194M parameters at this width.
#     Then the total is 800.1M, just above the limit.
#   - 65,536 (2^16) is a starting point that balances the compression on Chinese, English, and code against the
#     parameter cost. With 131,072, the total is 773.4M, still ≤ 0.8B.
#   When you change the vocabulary, always run count_params again. Make sure that the total stays at or below 0.8B.
#
# Pretraining token budget: Chapter 12 recommends about 400B (about $4.9K at MFU 0.4 and $2.5/GPU-hour).
# This is inside the $5K pretraining limit of GOAL.md 3.4; 500B costs about $6.1K and is above it.
# Pretraining stops in the stable phase of WSD. With the throughput that stage 6 measures, train until the budget is used.
# Mid-training does the decay. Gate 1 makes the final decision.
#   tokens per step = micro_batch_size 4 × grad_accum_steps 4 × 8 GPUs × seq_len 4096 = 524,288
#   max_steps = 400e9 / 524,288 ≈ 762,940
#   uv run python -m zero.tools.estimate_cost --config configs/main/pretrain.toml --tokens 400B --gpu h100-sxm
# Memory: zero/tools/memory_calc.py (Chapter 14) estimates about 114 GiB per GPU for micro batch 8 × 4096 in eager mode.
# This is more than 80GB, so we use 4 × accumulation 4 (the same tokens per step). If the memory is still not
# sufficient, turn on activation_checkpointing. Not verified on a GPU yet. Adjust after the measurements of stage 6.

[model]
vocab_size = 65536
dim = 1280
n_layers = 28
n_heads = 16
n_kv_heads = 8
head_dim = 128
ffn_dim = 3584
rope_theta = 10000.0     # 10,000 for pretraining. The long-context stage makes it larger (see longctx.toml)
max_seq_len = 4096
norm_eps = 1e-6
qk_norm = true
tie_embeddings = true
init_std = 0.02

[train]
seed = 1337
max_steps = 762940
micro_batch_size = 4
grad_accum_steps = 4
activation_checkpointing = false  # Change to true if the memory is not sufficient (Chapter 14)
device = "auto"
dtype = "auto"           # BF16 autocast on CUDA
compile = true           # Not verified on a GPU yet
parallel = "ddp"         # 0.7B + AdamW fits on an 80GB GPU. If the memory is not sufficient, change to "fsdp"
out_dir = "out/main/pretrain"
eval_every = 1000
eval_batches = 50

[data]
tokenizer = "data/tokenizer/tokenizer.json"
seq_len = 4096
val = "data/pretrain/val_*.bin"

# The ablations of Chapter 13 will set the data mix. For the licenses, see zero/data/sources.py
[[data.sources]]
name = "fineweb-edu"
path = "data/pretrain/fineweb-edu_*.bin"
weight = 0.40

[[data.sources]]
name = "dclm-baseline"
path = "data/pretrain/dclm-baseline_*.bin"
weight = 0.10

[[data.sources]]
name = "fineweb-2-zh"
path = "data/pretrain/fineweb-2-zh_*.bin"
weight = 0.30

[[data.sources]]
name = "stack-edu"
path = "data/pretrain/stack-edu_*.bin"
weight = 0.12

[[data.sources]]
name = "finemath"
path = "data/pretrain/finemath_*.bin"
weight = 0.08

[optim]
lr = 3e-4                # Starting point. Chapter 12 sets it after a sweep in the ladder experiment
weight_decay = 0.1
beta1 = 0.9
beta2 = 0.95
grad_clip = 1.0

[schedule]
kind = "wsd"             # After the stable phase, mid-training (midtrain.toml) does the decay
warmup_steps = 2000
decay_frac = 0.0         # Pretraining itself does not decay; the decay occurs in mid-training
min_lr_ratio = 0.0

[checkpoint]
every = 2000
keep_last = 3

[logging]
every = 10
