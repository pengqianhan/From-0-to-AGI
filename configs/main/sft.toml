# 主线模型 SFT（第 16 章）。第二步默认值，所有数值待阶梯实验 / 小规模试跑后调整。
#   uv run torchrun --standalone --nproc_per_node=8 -m zero.post.sft --config configs/main/sft.toml
# 尚未在 GPU 上验证（多卡 DDP 路径与预训练共用 Trainer，SFT 数据加载器 MaskedWindowLoader 在 CPU 上测过）。
#
# 估算：每步 token = 4 × 2 × 8 × 8192 = 524,288（打包后约 70% 是真实 token）；2,000 步 ≈ 1.05B token。
#   uv run python -m zero.tools.estimate_cost --config configs/main/pretrain.toml --tokens 1B --seq-len 8192
#   → 约 6.9 GPU·h、$17（MFU 0.4 的假设）

[model]                  # 与 configs/main/longctx.toml 的 checkpoint 形状一致（689.5M 参数）
vocab_size = 65536
dim = 1280
n_layers = 28
n_heads = 16
n_kv_heads = 8
head_dim = 128
ffn_dim = 3584
rope_theta = 1000000.0   # 长上下文阶段调大后的底数
max_seq_len = 32768
tie_embeddings = true

[train]
seed = 1337
max_steps = 2000         # ≈ 2 个 epoch（假设 SFT 数据约 0.5B token），待定
micro_batch_size = 4
grad_accum_steps = 2
device = "auto"
dtype = "auto"           # BF16 autocast
compile = true           # 尚未在 GPU 上验证
parallel = "ddp"
out_dir = "out/main/sft"
init_from = "out/main/longctx/ckpt"
eval_every = 200
eval_batches = 20

[data]
format = "sft"
tokenizer = "data/tokenizer/tokenizer.json"
seq_len = 8192           # 工具说明 + 多轮对话；更长的样本丢弃并计数

[sft]
train_jsonl = "data/sft/train.jsonl"   # 来源与许可证见第 16 章；工具调用数据需做 BFCL 函数名 / schema 去污染（GOAL.md 3.2）
val_jsonl = "data/sft/val.jsonl"
shard_dir = "data/sft/packed"

[optim]
lr = 5e-5                # 待调：小模型 SFT 常见 1e-5 ~ 1e-4
weight_decay = 0.0
grad_clip = 1.0

[schedule]
kind = "cosine"
warmup_steps = 100
min_lr_ratio = 0.1

[checkpoint]
every = 500
keep_last = 2

[logging]
every = 10
