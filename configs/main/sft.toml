# SFT of the main-line model (Chapter 16). Default values for Step 2. Adjust all values after the ladder experiment / small trial runs.
#   uv run torchrun --standalone --nproc_per_node=8 -m zero.post.sft --config configs/main/sft.toml
# Not verified on a GPU yet (the multi-GPU DDP path uses the same Trainer as pretraining; the SFT data loader MaskedWindowLoader is tested on a CPU).
#
# Estimate: tokens per step = 4 × 2 × 8 × 8192 = 524,288 (after packing, about 70% are real tokens); 2,000 steps ≈ 1.05B tokens.
#   uv run python -m zero.tools.estimate_cost --config configs/main/pretrain.toml --tokens 1B --seq-len 8192
#   → about 6.9 GPU·h, $17 (assumes MFU 0.4)

[model]                  # Same shape as the checkpoint of configs/main/longctx.toml (689.5M parameters)
vocab_size = 65536
dim = 1280
n_layers = 28
n_heads = 16
n_kv_heads = 8
head_dim = 128
ffn_dim = 3584
rope_theta = 1000000.0   # The larger base from the long-context stage
max_seq_len = 32768
tie_embeddings = true

[train]
seed = 1337
max_steps = 2000         # ≈ 2 epochs (assumes about 0.5B tokens of SFT data); not final
micro_batch_size = 4
grad_accum_steps = 2
device = "auto"
dtype = "auto"           # BF16 autocast
compile = true           # Not verified on a GPU yet
parallel = "ddp"
out_dir = "out/main/sft"
init_from = "out/main/longctx/ckpt"
eval_every = 200
eval_batches = 20

[data]
format = "sft"
tokenizer = "data/tokenizer/tokenizer.json"
seq_len = 8192           # Tool descriptions + multi-turn chat. Drop and count the longer samples

[sft]
train_jsonl = "data/sft/train.jsonl"   # For sources and licenses, see Chapter 16. Decontaminate the tool-calling data against the BFCL function names / schemas (GOAL.md 3.2)
val_jsonl = "data/sft/val.jsonl"
shard_dir = "data/sft/packed"

[optim]
lr = 5e-5                # Tune it later. SFT of small models usually uses 1e-5 ~ 1e-4
weight_decay = 0.0
grad_clip = 1.0

[schedule]
kind = "cosine"
warmup_steps = 100
min_lr_ratio = 0.1

[checkpoint]
every = 500
keep_last = 2

[logging]
every = 10
