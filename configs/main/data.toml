# Pretraining data recipe of the main-line model (Chapter 13). It runs only in Step 2. **All mix weights are provisional.**
# The Step 2 proxy ablations (see the end of this file) will set them. Record each change in the git history,
# and explain it in "Main-line progress" of Chapter 13.
#
# Commands:
#   uv sync --extra data
#   uv run python -m zero.data.download --config configs/main/data.toml --dry-run      # show the download plan
#   uv run python -m zero.data.download --config configs/main/data.toml --max-docs 1000  # check the fields on a small scale first
#   uv run python -m zero.data.pipeline --config configs/main/data.toml                 # filter → tokenizer → shards
# Note: the large-scale paths of download.py and pipeline.py are **not verified yet** (the build environment cannot access Hugging Face).
# pipeline.py runs in one process and keeps all data in memory. For the TB-scale data of Step 2,
# stage 5 (MinHash) must change to a distributed implementation (for example, datatrove).
#
# ---------------------------------------------------------------------------------------------
# Mix (by training tokens; the budget is about 400B tokens, see configs/main/pretrain.toml)
#
#   English web  0.45 = FineWeb-Edu 0.35 + DCLM-baseline 0.10
#   Chinese web  0.30 = FineWeb-2 Chinese 0.20 + Ultra-FineWeb Chinese 0.10
#   Code         0.15 = Stack-Edu
#   Math         0.10 = FineMath-3+
#
# Reasons (Chapter 13 and its references give the evidence):
# - Data is the largest lever, but the "best data" changes with the goal. In the leave-one-out experiments
#   of MobileLLM-R1, removal of FineWeb-Edu made knowledge, math, and code all worse
#   (web text is the "glue" that connects the domains). Thus general web text gets the largest share.
# - English > Chinese: there is much more open, high-quality (model-filtered) English data than Chinese data.
#   Chinese 0.30 is the minimum for the bilingual goal (C-Eval/CMMLU). For comparison: Puro-2B stage 1 has
#   11.7% Chinese (Chinese is not its goal), and Llama 3 has 8% multilingual data in total.
# - Code 0.15: tool calling is the generation of structured text from a schema (JSON, function signatures).
#   MobileLLM-R1 found that code data also helps math. The final Llama 3 mix has about 17% code.
#   The PCA of Puro-2B shows a trade-off between code ability and general ability.
#   Thus stage 1 uses at most 0.15. Mid-training (Chapter 15) adds more where we want more strength.
# - Math 0.10: Llama 3 has about 25% math and reasoning together. Puro-2B has 7.2% in stage 1 and 18.3% in stage 2.
#   Here also, part of the math waits for mid-training.
# - Passes (epochs) over each source at the 400B budget: FineWeb-Edu 140B / 1.3T ≈ 0.11; DCLM 40B / about 4T ≈ 0.01;
#   Ultra-FineWeb Chinese 40B / about 120B ≈ 0.33; Stack-Edu 60B / 125B ≈ 0.5; FineMath-3+ 40B / 34B ≈ 1.2
#   (each dataset card counts tokens with its own tokenizer, which is not the same as ours). FineWeb-2 Chinese
#   80B is much less than 1 pass over its total (636M documents, 1.6TB parquet). But it has only heuristic filters.
#   Step 2 must first train a Chinese quality classifier (as FineWeb-Edu did), then choose the threshold.
#   Up to 4 repetitions cost very little (Muennighoff et al. 2023). All sources here stay at or below 1.2 passes.
# ---------------------------------------------------------------------------------------------

[pipeline]
name = "main"
work_dir = "data/pipeline"        # JSONL of each stage (very large; it goes in data/, which is not in git)
out_dir = "data/pretrain"         # Shards: data/pretrain/<source>_{train,val}_*.bin (configs/main/pretrain.toml reads them here)
seed = 0
val_fraction = 0.001
val_max_docs = 5000
shard_tokens = 100_000_000
token_budget = 500e9
write_stages = false              # Write to disk only the final documents after decontamination (other stages record only the funnel counts)

[[sources]]
name = "fineweb-edu"
registry = "fineweb-edu"
inputs = ["data/raw/fineweb-edu/*.jsonl.gz"]
format = "jsonl"
weight = 0.35
lang = "en"
heuristics = "none"               # FineWeb already applied the Gopher/C4/FineWeb rules and MinHash in each dump
score_field = "int_score"
score_min = 3                     # The dataset already contains only scores ≥3. This line keeps a record of the threshold in the manifest
  [sources.download]
  repo = "HuggingFaceFW/fineweb-edu"
  config = "default"
  keep_fields = ["url", "dump", "score", "int_score", "token_count", "language_score"]
  target_bytes = 800_000_000_000  # ≈ 175B tokens × about 4.3 bytes/token ÷ keep rate of about 0.95 (update in Step 2 after a measurement with the main-line tokenizer)

[[sources]]
name = "dclm-baseline"
registry = "dclm-baseline"
inputs = ["data/raw/dclm-baseline/*.jsonl.gz"]
format = "jsonl"
weight = 0.10
lang = "en"
heuristics = "none"               # DCLM: RefinedWeb-style heuristics + Bloom filter dedup + fastText classifier (top 10%)
  [sources.download]
  repo = "mlfoundations/dclm-baseline-1.0"
  keep_fields = ["url"]           # Check the names of the other metadata fields in Step 2
  target_bytes = 230_000_000_000
  # Note: the dataset card calls it a "research baseline" (intended for research use only). The license is CC-BY-4.0.
  # Before we release a model, a person must check how these two statements agree (to be verified).

[[sources]]
name = "fineweb-2-zh"
registry = "fineweb-2-zh"
inputs = ["data/raw/fineweb-2-zh/*.jsonl.gz"]
format = "jsonl"
weight = 0.20
lang = "zh"
heuristics = "web"                # Apply our rules again (for Chinese, each character counts as a word). The thresholds are the English values of FineWeb; measure and check them again in Step 2
  [sources.download]
  repo = "HuggingFaceFW/fineweb-2"
  config = "cmn_Hani"             # Mandarin, Han characters (confirmed from the dataset directory, 2026-09)
  keep_fields = ["url", "dump", "language_score"]
  target_bytes = 350_000_000_000

[[sources]]
name = "ultra-fineweb-zh"
registry = "ultra-fineweb"
inputs = ["data/raw/ultra-fineweb-zh/*.jsonl.gz"]
format = "jsonl"
weight = 0.10
lang = "zh"
heuristics = "none"               # Already has heuristic filters + a fastText quality classifier (the core web data of MiniCPM4)
  [sources.download]
  repo = "openbmb/Ultra-FineWeb"
  split = "zh"
  text_field = "content"
  keep_fields = ["score", "source"]
  target_bytes = 180_000_000_000
  # License: the dataset page says Apache-2.0. But the Chinese part comes from upstream corpora such as IndustryCorpus2,
  # MiChao, WuDao, SkyPile, WanJuan, ChineseWebText, TeleChat, and CCI3. Their licenses are different
  # (for example, SkyPile uses the Skywork community license). Check each one before the Step 2 download.
  # If we cannot verify them, move this 0.10 into fineweb-2-zh.

[[sources]]
name = "stack-edu"
registry = "stack-edu"
inputs = ["data/raw/stack-edu/*.jsonl.gz"]
format = "jsonl"
weight = 0.15
lang = "code"
heuristics = "code"
  [sources.download]
  repo = "HuggingFaceTB/stack-edu"
  # The dataset contains only the file ids (blob_id). Get the content from the Software Heritage S3 bucket,
  # as the dataset card describes (this needs AWS credentials).
  # The language order is the priority. The languages most common in tool calls (Python/JS/TS/Shell/SQL/Markdown)
  # come first. Java (42B, half of the data) is last.
  config = ["Python", "JavaScript", "TypeScript", "Shell", "SQL", "Markdown", "Go", "Rust",
            "Cpp", "C", "CSharp", "PHP", "Ruby", "Swift", "Java"]
  id_field = "blob_id"
  swh_content = true
  keep_fields = ["repo_name", "path", "language", "score", "int_score", "detected_licenses", "license_type"]
  target_bytes = 300_000_000_000
  # License: the dataset page has no license field; it points to the terms of The Stack v2. Each file has
  # detected_licenses, so Step 2 can keep only the files with permissive licenses. sources.py still marks the
  # license as unverified, so the download needs --allow-unverified.

[[sources]]
name = "finemath"
registry = "finemath"
inputs = ["data/raw/finemath/*.jsonl.gz"]
format = "jsonl"
weight = 0.10
lang = "en"
heuristics = "none"
  [sources.download]
  repo = "HuggingFaceTB/finemath"
  config = "finemath-3plus"       # About 34B tokens. 4plus (about 9.6B) is for mid-training
  keep_fields = ["url", "score", "int_score", "token_count"]

[quality]
min_words = 50

[dedup]
exact = true
near = true
threshold = 0.8
num_perm = 128
bands = 16                        # S-curve threshold (1/16)^(1/8) ≈ 0.71. FineWeb uses 14 × 8 (threshold 0.72)
ngram = 5
cross_source = true               # The same article can be in both FineWeb-Edu and DCLM

[decontam]
n = 13
min_tokens = 8
# The evaluation code of Chapter 11 exports the evaluation sets as JSONL (prepared in Step 2).
# They also contain the function names and schemas of the tool-calling benchmark.
[[decontam.eval_sets]]
name = "mmlu-redux"
path = "data/eval_sets/mmlu_redux.jsonl"
[[decontam.eval_sets]]
name = "mmlu-pro"
path = "data/eval_sets/mmlu_pro.jsonl"
[[decontam.eval_sets]]
name = "ceval"
path = "data/eval_sets/ceval.jsonl"
[[decontam.eval_sets]]
name = "cmmlu"
path = "data/eval_sets/cmmlu.jsonl"
[[decontam.eval_sets]]
name = "gsm8k"
path = "data/eval_sets/gsm8k.jsonl"
[[decontam.eval_sets]]
name = "math-500"
path = "data/eval_sets/math500.jsonl"
[[decontam.eval_sets]]
name = "humaneval-plus"
path = "data/eval_sets/humaneval_plus.jsonl"
[[decontam.eval_sets]]
name = "mbpp-plus"
path = "data/eval_sets/mbpp_plus.jsonl"
[[decontam.eval_sets]]
name = "ifeval"
path = "data/eval_sets/ifeval.jsonl"
[[decontam.eval_sets]]
name = "bfcl"
path = "data/eval_sets/bfcl.jsonl"
[[decontam.eval_sets]]
name = "tool_dev"
path = "zero/eval/tasks/tool_dev.jsonl"

[tokenizer]
vocab_size = 65536                # Measurement and trade-off in Chapter 13, Section 10. model.vocab_size in configs/main/pretrain.toml must be the same
pretokenize = "qwen3.5"           # Differs from the Qwen3 regex only in \p{M}: the same splits on Chinese, English, and code. Hindi, Thai, and
                                  # similar languages no longer split at vowel signs. For GGUF export, pre_tokenizer is "qwen35" (llama.cpp supports it)
sample_bytes = 20_000_000_000     # Sample 20GB of text from the sources by the mix to train the tokenizer
min_frequency = 2
path = "data/pretrain/tokenizer.json"

# ---------------------------------------------------------------------------------------------
# Plan for the Step 2 mix proxy ablations. Run them, then change the weight values above.
#
# The method follows Puro-2B and the annealing evaluation of Llama 3 / OLMo 2. (Puro-2B starts from the same
# Qwen3-0.6B checkpoint and continues training on each candidate data slice for about 8.4B tokens. The candidate share
# increases linearly from 0 to 80% in the first 1600 steps. It compares a "capability vector" of 15 benchmarks.)
#   1. Start: a checkpoint from the middle of the stable phase of the largest size in the Chapter 12 ladder
#      experiment (configs/ladder/l150m.toml).
#   2. For each candidate (source, quality percentile band in the source, mix), continue training for about 2B tokens.
#      The candidate share increases linearly from 0 → 80%.
#   3. Compare the bpb on the dev set of each domain (zero/data/bpb.py; comparable across tokenizers) and the accuracy
#      on small benchmarks. Do not use the preregistered test benchmarks.
#   4. Compare the sources first, then the mixes (3–4 candidate mixes). At the end, spot-check the classifier
#      threshold for FineWeb-2 Chinese.
# Compute: uv run python -m zero.tools.estimate_cost --config configs/ladder/l150m.toml --tokens 2B --gpu h100-sxm
#   → 2.5e18 FLOPs, 1.8 GPU-hours, about $4 each (assumes MFU 0.4 and $2.5/GPU-hour; not verified on a GPU yet).
#   We plan 20–30 runs. With evaluation, the total is about $100–200. This is inside the GOAL.md 3.4 budget
#   for "Chapters 12–13: small-scale experiments ~$1,200".
# ---------------------------------------------------------------------------------------------
