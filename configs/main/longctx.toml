# Long-context extension of the main-line model to 32K (Chapter 15).
# The method follows the long-context stage of the Qwen3 technical report (arXiv:2505.09388): ABF increases
# the RoPE base from 1e4 to 1e6, and training continues with 32K sequences on data with more long documents.
# If inference needs a longer context, add YaRN on top (model.rope_scaling).
# Chapter 15 will set the exact number of steps and the data.
base = "pretrain.toml"

[model]
rope_theta = 1000000.0
max_seq_len = 32768

[train]
max_steps = 4000         # ≈ 4.2B tokens (1 × 4 × 8 × 32768 = 1,048,576 per step); not final
micro_batch_size = 1
grad_accum_steps = 4
parallel = "fsdp"        # The activations of 32K sequences are large, so FSDP2 saves memory (not verified on a GPU yet)
out_dir = "out/main/longctx"
init_from = "out/main/midtrain/ckpt"

[data]
seq_len = 32768

[optim]
lr = 1e-4

[schedule]
kind = "cosine"
warmup_steps = 200
min_lr_ratio = 0.1
