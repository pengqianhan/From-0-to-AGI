# GRPO of the main-line model (Chapter 19). Default values for Step 2; tune them later.
#   uv run python -m zero.post.grpo --config configs/main/grpo.toml
# The GRPO in zero is a readable implementation in one process (sampling uses zero.generate + KV cache,
# without continuous batching). If the throughput in Step 2 is not sufficient, follow the module docstring
# of zero/post/grpo.py: first do a parity check against verl on the same small task, then use verl for the real training.
# Not verified on a GPU yet.

[model]                  # Same shape as the checkpoint of configs/main/longctx.toml (689.5M parameters)
vocab_size = 65536
dim = 1280
n_layers = 28
n_heads = 16
n_kv_heads = 8
head_dim = 128
ffn_dim = 3584
rope_theta = 1000000.0   # The larger base from the long-context stage
max_seq_len = 32768
tie_embeddings = true

[train]
seed = 1337
max_steps = 500
device = "auto"
dtype = "auto"
out_dir = "out/main/grpo"
init_from = "out/main/dpo/ckpt"

[data]
format = "none"
tokenizer = "data/tokenizer/tokenizer.json"
seq_len = 8192

[grpo]
group_size = 16
prompts_per_step = 64    # 1024 responses per step
max_new_tokens = 512
temperature = 1.0
clip_eps = 0.2
clip_eps_high = 0.28     # clip-higher (DAPO), a "GRPO improvement". Not verified yet if it is a consensus. Set 0 to turn it off
kl_coef = 0.0
ppo_epochs = 1
loss_agg = "token_mean"
scale_rewards = true
n_train_tasks = 100000
env_seed = 19
forward_batch = 16

[optim]
lr = 1e-6
weight_decay = 0.0
grad_clip = 1.0

[schedule]
kind = "constant"
warmup_steps = 10

[checkpoint]
every = 50
keep_last = 3

[logging]
every = 1
