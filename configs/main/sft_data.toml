# --- Chinese --------------------------------------------------------------------------------
# Chinese general instruction data with a clean license is the gap of this mixture (runs/POSTTRAIN_PLAN.md 6.2).

[[sources]]
name = "smoltalk2-multilingual-zh"     # Qwen translations of Magpie-Ultra / constraints prompts; keep only zh
path = "data/raw/smoltalk2/SFT/smoltalk_multilingual_8languages_lang_5_no_think-*.parquet"
license = "待核实"
langs = ["zh"]

[[sources]]
name = "smoltalk-chinese"
path = "data/raw/smoltalk-chinese/*.parquet"
license = "待核实"
langs = ["zh"]
max_rows = 200000
notes = "Metadata says Apache-2.0, but the card adds the OpenCSG Community License: commercial use needs written permission (lorraineg@opencsg.com)."
