# SFT data mixture of the main line (Chapter 16; runs/POSTTRAIN_PLAN.md, section 6.2).
#   uv run python -m zero.post.sft_data --config configs/main/sft_data.toml
# Output: data/sft/train.jsonl, val.jsonl, meta.json (rows, tokens, and licenses of each source and language).
# The three tracks (proxy / weak / main) share this output; only the packing depends on the tokenizer.
#
# License rule (GOAL.md 3.3): a source or row with license "待核实" (to be verified) is DROPPED until a person
# verifies it and writes the license here. NC licenses are always dropped. Check the data card again before use:
# the values below were read on 2026-10-10.
# Download (Step 2, a machine with access to Hugging Face):
#   huggingface-cli download HuggingFaceTB/smoltalk2 --repo-type dataset --include "SFT/*no_think*" --local-dir data/raw/smoltalk2
#   huggingface-cli download opencsg/smoltalk-chinese --repo-type dataset --local-dir data/raw/smoltalk-chinese
# Shares: check meta.json "train_stats" (by tokens) and adjust max_rows / repeat. A starting target:
# tool calls (fc + tool_env) ~25% of tokens, Chinese ~30%, the rest general English.

[build]
out_dir = "data/sft"
val_size = 2000
seed = 0
tokenizer = "data/tokenizer/tokenizer.json"   # main-line tokenizer: token counts and max_tokens
max_tokens = 8192                             # = data.seq_len of configs/main/sft.toml
drop_thinking = true                          # the main-line model has no thinking mode by default
allow_unverified = false
near_dedup = true
near_threshold = 0.85
# Evaluation prompts for the 13-gram check: export the questions of each preregistered benchmark
# (eval/PREREGISTRATION.md, section 2) with zero.eval.export_prompts first. BFCL / ACEBench: fc_tasks export.
decontam_texts = ["data/eval/prompts/*.jsonl"]
decontam_bfcl = []
decontam_tasks = ["data/eval/bfcl_v4.jsonl", "data/eval/acebench_zh.jsonl", "data/eval/acebench_en.jsonl"]   # zero.post.envs.fc_tasks export
decontam_n = 13

# --- Tool calls -------------------------------------------------------------------------------

[[sources]]
name = "fc-tool-calls"                 # Hermes + ToolACE (Apache-2.0), from: zero.post.envs.fc_tasks split --sft-out
path = "data/sft/fc_sft.jsonl"
format = "sft"                         # each row carries its own license
license = "待核实"
notes = "Already decontaminated against BFCL by fc_tasks build; the check runs again here."

[[sources]]
name = "tool-env"                      # our own synthetic trajectories (executable, verified)
format = "tool_env"
license = "own"
max_rows = 20000

# --- General English (SmolTalk2 SFT, no_think subsets) --------------------------------------
# The data card has no license metadata; each subset inherits its upstream terms (some are generated by
# Qwen3-32B / Qwen2.5, check those terms). Set the license after verification.

[[sources]]
name = "smoltalk2-magpie-ultra"
path = "data/raw/smoltalk2/SFT/smoltalk_smollm3_smol_magpie_ultra_no_think-*.parquet"
license = "待核实"
max_rows = 200000

[[sources]]
name = "smoltalk2-systemchats"
path = "data/raw/smoltalk2/SFT/smoltalk_smollm3_systemchats_30k_no_think-*.parquet"
license = "待核实"

[[sources]]
name = "smoltalk2-everyday"
path = "data/raw/smoltalk2/SFT/smoltalk_smollm3_everyday_conversations_no_think-*.parquet"
