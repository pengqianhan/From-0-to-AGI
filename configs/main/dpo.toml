# DPO of the main-line model (Chapter 18). Default values for Step 2; tune them later.
#   uv run python -m zero.post.dpo --config configs/main/dpo.toml
# The DPO in zero runs in one process now (one GPU can hold the 0.7B policy + the precomputed reference log-probabilities).
# There is no multi-GPU version yet, and the code is not verified on a GPU yet.

[model]                  # Same shape as the checkpoint of configs/main/longctx.toml (689.5M parameters)
vocab_size = 65536
dim = 1280
n_layers = 28
n_heads = 16
n_kv_heads = 8
head_dim = 128
ffn_dim = 3584
rope_theta = 1000000.0   # The larger base from the long-context stage
max_seq_len = 32768
tie_embeddings = true

[train]
seed = 1337
max_steps = 1000
micro_batch_size = 8     # 8 pairs = 16 sequences
grad_accum_steps = 8     # 64 pairs per step
device = "auto"
dtype = "auto"
out_dir = "out/main/dpo"
init_from = "out/main/distill/ckpt"

[data]
format = "none"
tokenizer = "data/tokenizer/tokenizer.json"
seq_len = 8192

[dpo]
train_jsonl = "data/dpo/prefs.jsonl"   # Online preference pairs: if generate_pairs > 0 and the file does not exist, use the current policy + tool_env
beta = 0.1
ref_mode = "precompute"
generate_pairs = 0
samples_per_prompt = 8
gen_temperature = 1.0
max_new_tokens = 512

[optim]
lr = 5e-7                # DPO usually uses 5e-7 ~ 1e-6; tune it later
weight_decay = 0.0
grad_clip = 1.0

[schedule]
kind = "cosine"
warmup_steps = 50
min_lr_ratio = 0.0

[checkpoint]
every = 200
keep_last = 2
